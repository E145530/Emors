<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Code Organizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --border-color: rgba(255, 255, 255, 0.15);
            --badge-bg: rgba(99, 102, 241, 0.2);
            --badge-text: #c7d2fe;
            --custom-card-bg-img: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Wallpaper Background Layers */
        #wallpaperContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #wallpaperOverlayLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            transition: background-color 0.3s ease;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 16px;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* Sticky Header Container */
        .header-sticky {
            position: sticky;
            top: 0;
            z-index: 900;
            background-color: transparent;
            padding-top: 8px;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .controls {
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .header-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .toggle-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 13px;
            padding: 6px 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .toggle-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Smooth Collapsible Animation for Filter Menu */
        .controls-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease-in-out, padding 0.3s ease;
        }

        .controls-content.collapsed {
            max-height: 0;
            opacity: 0;
            gap: 0;
            padding-top: 0;
            padding-bottom: 0;
            pointer-events: none;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        input, select, button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        input:focus, select:focus {
            outline: 2px solid var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, filter 0.2s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.15);
        }

        button:active {
            transform: scale(0.98);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats {
            color: var(--text-sub);
            font-size: 14px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* Card Animation & Styling */
        .card {
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background-color 0.3s ease, border 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        /* Box / Card Appearance Themes */
        .appearance-solid {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .appearance-glass {
            background: rgba(var(--card-bg-rgb), 0.55) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .appearance-glow {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--accent) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .appearance-glow:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
        }

        .appearance-customPic {
            background-image: var(--custom-card-bg-img) !important;
            background-size: cover !important;
            background-position: center !important;
            border: 1px solid var(--border-color) !important;
            position: relative;
        }

        .appearance-customPic::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            border-radius: inherit;
            z-index: 0;
        }

        .appearance-customPic > * {
            position: relative;
            z-index: 1;
        }

        .oc-image {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            margin-bottom: 12px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .card:hover .oc-image {
            transform: scale(1.02);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .oc-name {
            font-weight: bold;
            font-size: 16px;
            margin: 0;
            word-break: break-word;
        }

        .oc-code {
            font-family: monospace;
            font-size: 18px;
            color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: center;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px dashed var(--border-color);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .oc-code:hover {
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.2);
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
        }

        .badge-version {
            background-color: rgba(6, 95, 70, 0.6);
            color: #a7f3d0;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .card-actions button {
            flex: 1;
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background-color: #991b1b;
        }

        .btn-danger:hover {
            background-color: #7f1d1d;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content h2, .modal-content h3 {
            margin-top: 0;
            margin-bottom: 4px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            z-index: 2000;
        }
    </style>
</head>
<body>

<!-- Wallpaper Layers -->
<div id="wallpaperContainer"></div>
<div id="wallpaperOverlayLayer"></div>

<div class="container">
    <h1>OC Code Organizer</h1>

    <!-- Sticky and Retractable Header Controls -->
    <div class="header-sticky">
        <div class="controls appearance-solid" id="headerControls">
            <div class="header-top-bar">
                <span class="stats" id="statsDisplay">Showing 0 / 0 OCs</span>
                <button class="toggle-btn" id="toggleHeaderBtn" onclick="toggleHeaderControls()">Fold Menu 🔼</button>
            </div>

            <!-- Cloud Sync Panel -->
            <div class="cloud-sync-panel" style="margin-top: 5px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border-color);">
                <h3 style="margin-bottom: 8px; font-size: 15px;">☁️ Cloud Sync (JSONBin)</h3>
                <input type="text" id="jsonbin-id" placeholder="Enter Bin ID" style="width: 100%; margin-bottom: 6px; padding: 6px; box-sizing: border-box;">
                <input type="password" id="jsonbin-key" placeholder="Enter Master/Access Key" style="width: 100%; margin-bottom: 8px; padding: 6px; box-sizing: border-box;">
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button id="sync-push" class="btn" style="padding: 6px 12px; font-size: 13px;">Push ⬆️</button>
                    <button id="sync-pull" class="btn" style="padding: 6px 12px; font-size: 13px;">Pull ⬇️</button>
                </div>
                <small id="sync-status" style="display: block; margin-top: 6px; color: var(--text-sub);"></small>
            </div>

            <div class="controls-content" id="controlsContent">
                <div class="filter-grid">
                    <input type="text" id="searchInput" placeholder="Search by name, code, or tags...">
                    
                    <select id="versionFilter">
                        <option value="ALL">All Versions</option>
                    </select>

                    <select id="categoryFilter">
                        <option value="ALL">All Categories</option>
                    </select>

                    <select id="tagFilter">
                        <option value="ALL">All Variation Tags</option>
                    </select>

                    <select id="imageFilter">
                        <option value="ALL">All Picture Status</option>
                        <option value="HAS_IMAGE">With Picture</option>
                        <option value="NO_IMAGE">Without Picture</option>
                    </select>
                </div>

                <div class="action-bar">
                    <div>
                        <button class="btn-secondary" onclick="bulkEditOCs()">Bulk Edit Selected</button>
                        <button class="btn-secondary" onclick="renameCategory()">Rename Category</button>
                        <button class="btn-secondary" onclick="renameVersion()">Rename Version</button>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn-secondary" onclick="openThemeModal()">🎨 Theme Settings</button>
                        <button onclick="openModal()">+ Add New OC</button>
                        <button class="btn-secondary" onclick="exportData()">Export Backup</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-grid" id="ocGrid"></div>
</div>

<!-- Modal for Theme Customization -->
<div class="modal" id="themeModal">
    <div class="modal-content appearance-solid" id="themeModalContent">
        <h2>🎨 Theme Customization</h2>
        
        <label for="presetSelect">Theme Preset:</label>
        <select id="presetSelect" onchange="applyPresetTheme(this.value)">
            <option value="default">Default Dark Slate</option>
            <option value="glass">Liquid Glass Dark</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            <option value="emerald">Emerald Forest</option>
            <option value="sunset">Sunset Rose</option>
            <option value="light">Light Mode Clean</option>
            <option value="custom">Custom</option>
        </select>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label for="colorAccent">Accent Color:</label>
                <input type="color" id="colorAccent" style="height: 40px; padding: 2px; width: 100%; cursor: pointer;">
            </div>
            <div>
                <label for="colorBg">Background Color:</label>
                <input type="color" id="colorBg" style="height: 40px; padding: 2px; width: 100%; cursor: pointer;">
            </div>
            <div>
                <label for="colorCard">Card / Menu Color:</label>
                <input type="color" id="colorCard" style="height: 40px; padding: 2px; width: 100%; cursor: pointer;">
            </div>
            <div>
                <label for="colorText">Text Color:</label>
                <input type="color" id="colorText" style="height: 40px; padding: 2px; width: 100%; cursor: pointer;">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 6px 0;">

        <h3>Box / Menu Appearance</h3>
        <label for="cardStyleSelect">Card Style:</label>
        <select id="cardStyleSelect" onchange="toggleCustomCardPicInput()">
            <option value="solid">Solid Classic</option>
            <option value="glass">Liquid Glass (Gaussian Blur)</option>
            <option value="glow">Neon Glow Border</option>
            <option value="customPic">Custom Texture / Picture</option>
        </select>

        <div id="customCardPicGroup" style="display: none; flex-direction: column; gap: 8px;">
            <label for="inputCardPic">Card Background Picture URL:</label>
            <input type="url" id="inputCardPic" placeholder="https://example.com/texture.jpg">
            <label for="inputCardPicFile">Or Upload Card Texture:</label>
            <input type="file" id="inputCardPicFile" accept="image/*" onchange="handleCardTextureUpload(event)">
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 6px 0;">

        <h3>Wallpaper Settings</h3>
        <label for="inputWallpaper">Wallpaper Image URL:</label>
        <div style="display: flex; gap: 8px;">
            <input type="url" id="inputWallpaper" placeholder="https://example.com/wallpaper.jpg" style="flex: 1;">
            <button type="button" class="btn-danger" style="padding: 8px 12px; font-size: 12px;" onclick="removeWallpaper()">Remove</button>
        </div>

        <label for="inputWallpaperFile">Or Upload Direct Wallpaper File:</label>
        <input type="file" id="inputWallpaperFile" accept="image/*" onchange="handleWallpaperUpload(event)">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label for="wallpaperBlur">Blur: <span id="blurVal">0px</span></label>
                <input type="range" id="wallpaperBlur" min="0" max="20" value="0" style="width: 100%;" oninput="document.getElementById('blurVal').textContent = this.value + 'px'">
            </div>
            <div>
                <label for="wallpaperOverlay">Dark Overlay: <span id="overlayVal">30%</span></label>
                <input type="range" id="wallpaperOverlay" min="0" max="90" value="30" style="width: 100%;" oninput="document.getElementById('overlayVal').textContent = this.value + '%'">
            </div>
        </div>

        <div class="modal-buttons" style="margin-top: 16px;">
            <button class="btn-secondary" onclick="resetTheme()">Reset Default</button>
            <button class="btn-secondary" onclick="closeThemeModal()">Cancel</button>
            <button onclick="saveThemeSettings()">Save & Apply</button>
        </div>
    </div>
</div>

<!-- Modal for Adding/Editing Codes -->
<div class="modal" id="editorModal">
    <div class="modal-content appearance-solid" id="editorModalContent">
        <h2 id="modalTitle">Add New OC</h2>
        
        <label for="inputCode">9-Character Code:</label>
        <input type="text" id="inputCode" maxlength="9" placeholder="e.g. EISVWOF9D">

        <label for="inputName">OC Name / Title:</label>
        <input type="text" id="inputName" placeholder="e.g. Son">

        <label for="inputImage">Picture URL:</label>
        <div style="display: flex; gap: 8px;">
            <input type="url" id="inputImage" placeholder="https://example.com/character.png" style="flex: 1;">
            <button type="button" class="btn-danger" style="padding: 8px 12px; font-size: 12px; white-space: nowrap;" onclick="removePictureInput()">Delete Picture</button>
        </div>

        <label for="inputFile">Or Upload Direct Image File:</label>
        <input type="file" id="inputFile" accept="image/*" onchange="handleFileUpload(event)">

        <label for="inputImageFit">Image Fit Style:</label>
        <select id="inputImageFit">
            <option value="cover">Cover (Crop to fill)</option>
            <option value="contain">Contain (Fit full picture)</option>
            <option value="fill">Fill (Stretch)</option>
            <option value="scale-down">Scale Down</option>
        </select>

        <label for="inputVersion">Design Version:</label>
        <input type="text" id="inputVersion" list="versionList" placeholder="Select or type new version...">
        <datalist id="versionList"></datalist>

        <label for="inputCategory">Category / Association:</label>
        <input type="text" id="inputCategory" list="categoryList" placeholder="Select or type new category...">
        <datalist id="categoryList"></datalist>

        <label for="inputTags">Variation Tags (comma-separated):</label>
        <input type="text" id="inputTags" placeholder="e.g. Boy, Remastered, Winter, Redesign">

        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button onclick="saveOC()">Save OC</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Code copied to clipboard!</div>

<script>
    // Initial Dataset Extracted directly from Document
    const rawData = [
        { code: "EISVWOF9D", name: "Son", version: "OC TEMPLATE", category: "Base Templates", tags: ["Boy"] },
        { code: "VPE4R54U3", name: "Boy", version: "OC TEMPLATE", category: "Base Templates", tags: ["Boy"] },
        { code: "XGQDLN7V9", name: "Boy Remastered", version: "OC TEMPLATE", category: "Base Templates", tags: ["Boy", "Remastered"] },
        { code: "CYQOJTDJH", name: "Boy Realis", version: "OC TEMPLATE", category: "Base Templates", tags: ["Boy", "Realis"] },
        { code: "G723C9QJE", name: "Boy Masc", version: "OC TEMPLATE", category: "Base Templates", tags: ["Boy"] },
        { code: "Y7NBUWYNL", name: "Man", version: "OC TEMPLATE", category: "Base Templates", tags: ["Man"] },
        { code: "94DG7YQ9L", name: "👀 (Boy)", version: "OC TEMPLATE", category: "Base Templates", tags: [] },

        { code: "2U3V6DSWE", name: "Girl Remastered", version: "OC TEMPLATE", category: "Base Templates", tags: ["Girl", "Remastered"] },
        { code: "FD4EMQKFA", name: "Girl Realis", version: "OC TEMPLATE", category: "Base Templates", tags: ["Girl", "Realis"] },
        { code: "Y24MI8NYU", name: "Girl Fem", version: "OC TEMPLATE", category: "Base Templates", tags: ["Girl"] },
        { code: "X4PMCW5R1", name: "Woman", version: "OC TEMPLATE", category: "Base Templates", tags: ["Woman"] },
        { code: "5B5K8M8EY", name: "👀 (Girl)", version: "OC TEMPLATE", category: "Base Templates", tags: [] },

        { code: "7BDXOWAKM", name: "Smol", version: "OC TEMPLATE", category: "Base Templates", tags: ["Smol"] }
    ];

    // Theme Preset Data
    const PRESET_THEMES = {
        default: {
            preset: "default",
            bgColor: "#0f172a",
            cardBg: "#1e293b",
            textColor: "#f8fafc",
            accentColor: "#6366f1",
            cardStyle: "solid",

            wallpaperOverlay: 30
        },
        cyberpunk: {
            preset: "cyberpunk",
            bgColor: "#0d0221",
            cardBg: "#19063b",
            textColor: "#00f6ff",
            accentColor: "#ff007f",
            cardStyle: "glow",
            cardBgPic: "",
            wallpaperUrl: "",
            wallpaperBlur: 0,
            wallpaperOverlay: 30
        },
        emerald: {
            preset: "emerald",
            bgColor: "#022c22",
            cardBg: "#064e3b",
            textColor: "#ecfdf5",
            accentColor: "#10b981",
            cardStyle: "glass",
            cardBgPic: "",
            wallpaperUrl: "",
            wallpaperBlur: 0,
            wallpaperOverlay: 30
        },
        sunset: {
            preset: "sunset",
            bgColor: "#2d1215",
            cardBg: "#4a1d24",
            textColor: "#fff1f2",
            accentColor: "#f43f5e",
            cardStyle: "glass",
            cardBgPic: "",
            wallpaperUrl: "",
            wallpaperBlur: 0,
            wallpaperOverlay: 30
        },
        light: {
            preset: "light",
            bgColor: "#f1f5f9",
            cardBg: "#ffffff",
            textColor: "#0f172a",
            accentColor: "#2563eb",
            cardStyle: "solid",
            cardBgPic: "",

        }

    // App State Management
    let ocs = JSON.parse(localStorage.getItem("gacha_ocs")) || rawData;
    let themeSettings = JSON.parse(localStorage.getItem("gacha_theme")) || PRESET_THEMES.default;
    let editingIndex = null;
    let uploadedImageDataUrl = "";

    // Elements
    const ocGrid = document.getElementById("ocGrid");
    const searchInput = document.getElementById("searchInput");
    const versionFilter = document.getElementById("versionFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const tagFilter = document.getElementById("tagFilter");
    const imageFilter = document.getElementById("imageFilter");
    const statsDisplay = document.getElementById("statsDisplay");

    // Toggle Header
    function toggleHeaderControls() {
        const content = document.getElementById("controlsContent");
        const btn = document.getElementById("toggleHeaderBtn");
        content.classList.toggle("collapsed");
        btn.textContent = content.classList.contains("collapsed") ? "Unfold Menu 🔽" : "Fold Menu 🔼";
    }

    // Scroll Retraction Logic
    let isOverFilter = false;
    const headerControls = document.getElementById("headerControls");

    headerControls.addEventListener("mouseenter", () => { isOverFilter = true; });
    headerControls.addEventListener("mouseleave", () => { isOverFilter = false; });
    headerControls.addEventListener("touchstart", () => { isOverFilter = true; }, { passive: true });
    headerControls.addEventListener("touchend", () => { setTimeout(() => { isOverFilter = false; }, 300); }, { passive: true });

    window.addEventListener("scroll", () => {
        if (!isOverFilter) {
            const content = document.getElementById("controlsContent");
            const btn = document.getElementById("toggleHeaderBtn");
            if (!content.classList.contains("collapsed")) {
                content.classList.add("collapsed");
                btn.textContent = "Unfold Menu 🔽";
            }
        }
    }, { passive: true });

    // Handle File Upload
    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageDataUrl = e.target.result;
                document.getElementById("inputImage").value = "";
            };
            reader.readAsDataURL(file);
        }
    }

    function removePictureInput() {
        document.getElementById("inputImage").value = "";
        document.getElementById("inputFile").value = "";
        uploadedImageDataUrl = "";
        if (editingIndex !== null) {
            ocs[editingIndex].image = "";
        }
    }

    // Populate Filters Dynamically
    function updateDropdowns() {
        const currentCat = categoryFilter.value;
        const currentVer = versionFilter.value;
        const currentTag = tagFilter.value;

        const categories = [...new Set(ocs.map(o => o.category).filter(Boolean))].sort();
        const tags = [...new Set(ocs.flatMap(o => o.tags).filter(Boolean))].sort();
        const versions = [...new Set(ocs.map(o => o.version).filter(Boolean))].sort();

        categoryFilter.innerHTML = '<option value="ALL">All Categories</option>' + 
            categories.map(c => `<option value="${c}">${c}</option>`).join('');

        tagFilter.innerHTML = '<option value="ALL">All Variation Tags</option>' + 
            tags.map(t => `<option value="${t}">${t}</option>`).join('');

        versionFilter.innerHTML = '<option value="ALL">All Versions</option>' + 
            versions.map(v => `<option value="${v}">${v}</option>`).join('');

        if (categories.includes(currentCat)) categoryFilter.value = currentCat;
        if (versions.includes(currentVer)) versionFilter.value = currentVer;
        if (tags.includes(currentTag)) tagFilter.value = currentTag;

        document.getElementById("categoryList").innerHTML = categories.map(c => `<option value="${c}">`).join('');
        document.getElementById("versionList").innerHTML = versions.map(v => `<option value="${v}">`).join('');
    }

    function renameCategory() {
        const categories = [...new Set(ocs.map(o => o.category).filter(Boolean))].sort();
        if (!categories.length) return alert("No categories found.");

        const oldCat = prompt(`Enter existing category to rename:\n\nAvailable: ${categories.join(', ')}`);
        if (!oldCat || !categories.includes(oldCat)) return;

        const newCat = prompt(`Enter new category name for "${oldCat}":`);
        if (!newCat || !newCat.trim()) return;

        ocs.forEach(oc => {
            if (oc.category === oldCat) oc.category = newCat.trim();
        });

        localStorage.setItem("gacha_ocs", JSON.stringify(ocs));
        updateDropdowns();
        render();
        alert(`Renamed category "${oldCat}" to "${newCat.trim()}".`);
    }

    function renameVersion() {
        const versions = [...new Set(ocs.map(o => o.version).filter(Boolean))].sort();
        if (!versions.length) return alert("No versions found.");

        const oldVer = prompt(`Enter existing version to rename:\n\nAvailable: ${versions.join(', ')}`);
        if (!oldVer || !versions.includes(oldVer)) return;

        const newVer = prompt(`Enter new version name for "${oldVer}":`);
        if (!newVer || !newVer.trim()) return;

        ocs.forEach(oc => {
            if (oc.version === oldVer) oc.version = newVer.trim();
        });

        localStorage.setItem("gacha_ocs", JSON.stringify(ocs));
        updateDropdowns();
        render();
        alert(`Renamed version "${oldVer}" to "${newVer.trim()}".`);
    }

    // Render Cards
    function render() {
        const searchVal = searchInput.value.toLowerCase();
        const verVal = versionFilter.value;
        const catVal = categoryFilter.value;
        const tagVal = tagFilter.value;
        const imgVal = imageFilter ? imageFilter.value : "ALL";

        const filtered = ocs.filter(oc => {
            const matchesSearch = oc.name.toLowerCase().includes(searchVal) || 
                                  oc.code.toLowerCase().includes(searchVal) ||
                                  oc.tags.some(t => t.toLowerCase().includes(searchVal));
            const matchesVer = verVal === "ALL" || oc.version === verVal;
            const matchesCat = catVal === "ALL" || oc.category === catVal;
            const matchesTag = tagVal === "ALL" || oc.tags.includes(tagVal);

            const hasImage = Boolean(oc.image && oc.image.trim() !== "");
            const matchesImg = imgVal === "ALL" || 
                              (imgVal === "HAS_IMAGE" && hasImage) || 
                              (imgVal === "NO_IMAGE" && !hasImage);

            return matchesSearch && matchesVer && matchesCat && matchesTag && matchesImg;
        });

        statsDisplay.textContent = `Showing ${filtered.length} / ${ocs.length} OCs`;

        ocGrid.innerHTML = filtered.map((oc) => {
            const realIndex = ocs.indexOf(oc);
            const imgSrc = oc.image || 'https://via.placeholder.com/300x180/1e293b/94a3b8?text=No+Image';
            const imgFitStyle = oc.imageFit || 'cover';

            return `
                <div class="card">
                    <div>
                        <img class="oc-image" src="${imgSrc}" alt="${oc.name}" style="object-fit: ${imgFitStyle};" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x180/1e293b/94a3b8?text=Image+Error'">
                        <div class="card-header">
                            <h3 class="oc-name">${oc.name}</h3>
                            <input type="checkbox" class="oc-select" value="${realIndex}" style="width:18px; height:18px; cursor:pointer;">
                        </div>
                        <div class="oc-code" onclick="copyCode('${oc.code}')" title="Click to copy code">
                            ${oc.code}
                        </div>
                        <div class="badge-container">
                            <span class="badge badge-version">${oc.version}</span>
                            <span class="badge">${oc.category || 'General'}</span>
                            ${oc.tags.map(t => `<span class="badge" style="background:var(--accent); color:var(--text-main);">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-secondary" onclick="editOC(${realIndex})">Edit</button>
                        <button class="btn-danger" onclick="deleteOC(${realIndex})">Delete</button>
                    </div>
                </div>
            `;
        }).join('');

        applyTheme(themeSettings);
    }

    // Copy to Clipboard
    function copyCode(code) {
        navigator.clipboard.writeText(code);
        const toast = document.getElementById("toast");
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 2000);
    }

    // Open Add/Edit Modal
    function openModal(index = null) {
        editingIndex = index;
        uploadedImageDataUrl = "";
        document.getElementById("inputFile").value = "";
        const modal = document.getElementById("editorModal");
        
        if (index !== null) {
            document.getElementById("modalTitle").textContent = "Edit OC Code";
            document.getElementById("inputCode").value = ocs[index].code;
            document.getElementById("inputName").value = ocs[index].name;
            document.getElementById("inputImage").value = ocs[index].image || '';
            document.getElementById("inputImageFit").value = ocs[index].imageFit || 'cover';
            document.getElementById("inputVersion").value = ocs[index].version;
            document.getElementById("inputCategory").value = ocs[index].category || '';
            document.getElementById("inputTags").value = ocs[index].tags.join(', ');
        } else {
            document.getElementById("modalTitle").textContent = "Add New OC";
            document.getElementById("inputCode").value = '';
            document.getElementById("inputName").value = '';
            document.getElementById("inputImage").value = '';
            document.getElementById("inputImageFit").value = 'cover';
            document.getElementById("inputVersion").value = 'OC TEMPLATE';
            document.getElementById("inputCategory").value = '';
            document.getElementById("inputTags").value = '';
        }

        modal.style.display = "flex";
    }

    function closeModal() {
        document.getElementById("editorModal").style.display = "none";
    }

    function saveOC() {
        const code = document.getElementById("inputCode").value.trim().toUpperCase();
        const name = document.getElementById("inputName").value.trim();
        const imageUrlInput = document.getElementById("inputImage").value.trim();
        const imageFit = document.getElementById("inputImageFit").value;
        const version = document.getElementById("inputVersion").value;
        const category = document.getElementById("inputCategory").value.trim();
        const tags = document.getElementById("inputTags").value.split(',').map(t => t.trim()).filter(Boolean);

        if (!code || !name) {
            alert("Please provide both a Code and an OC Name.");
            return;
        }

        const image = uploadedImageDataUrl || imageUrlInput;
        const newOC = { code, name, image, imageFit, version, category, tags };

        if (editingIndex !== null) {
            ocs[editingIndex] = newOC;
        } else {
            ocs.unshift(newOC);
        }

        localStorage.setItem("gacha_ocs", JSON.stringify(ocs));
        closeModal();
        updateDropdowns();
        render();
    }

    function editOC(index) { openModal(index); }

    function deleteOC(index) {
        if (confirm(`Are you sure you want to delete "${ocs[index].name}" (${ocs[index].code})?`)) {
            ocs.splice(index, 1);
            localStorage.setItem("gacha_ocs", JSON.stringify(ocs));
            updateDropdowns();
            render();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ocs, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "oc_codes_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function bulkEditOCs() {
        const selectedCheckboxes = document.querySelectorAll('.oc-select:checked');
        const selectedIndices = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));

        if (selectedIndices.length === 0) {
            alert("Please check at least one OC card to bulk edit.");
            return;
        }

        const newVersion = prompt(`[Bulk Edit ${selectedIndices.length} OCs]\nEnter new Design Version (or leave blank to keep unchanged):`);
        const newCategory = prompt(`[Bulk Edit ${selectedIndices.length} OCs]\nEnter new Category (or leave blank to keep unchanged):`);
        const newTag = prompt(`[Bulk Edit ${selectedIndices.length} OCs]\nEnter a Tag to add to all selected (or leave blank to keep unchanged):`);

        selectedIndices.forEach(idx => {
            if (newVersion && newVersion.trim()) ocs[idx].version = newVersion.trim();
            if (newCategory && newCategory.trim()) ocs[idx].category = newCategory.trim();
            if (newTag && newTag.trim()) {
                if (!ocs[idx].tags.includes(newTag.trim())) ocs[idx].tags.push(newTag.trim());
            }
        });

        localStorage.setItem("gacha_ocs", JSON.stringify(ocs));
        updateDropdowns();
        render();
        alert(`Successfully updated ${selectedIndices.length} OCs!`);
    }

    // Cloud Sync Configuration keys
    const CONFIG_KEYS = {
        binId: 'oc_jsonbin_id',
        apiKey: 'oc_jsonbin_key'
    };

    function setSyncStatus(message, isError = false) {
        const statusEl = document.getElementById('sync-status');
        if(statusEl) {
            statusEl.textContent = message;
            statusEl.style.color = isError ? '#ff4d4d' : '#2ecc71';
        }
    }

    async function pushToCloud() {
        const binId = document.getElementById('jsonbin-id').value.trim();
        const apiKey = document.getElementById('jsonbin-key').value.trim();
        
        if (!binId || !apiKey) {
            setSyncStatus('Please enter both Bin ID and API Key.', true);
            return;
        }

        localStorage.setItem(CONFIG_KEYS.binId, binId);
        localStorage.setItem(CONFIG_KEYS.apiKey, apiKey);

        const payload = {
            ocs: JSON.parse(localStorage.getItem('gacha_ocs') || '[]'),
            settings: JSON.parse(localStorage.getItem('gacha_theme') || '{}'),
            lastUpdated: new Date().toISOString()
        };

        setSyncStatus('Pushing data to cloud...');

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': apiKey,
                    'X-Bin-Versioning': 'false'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            setSyncStatus('Successfully synced to cloud! ✅');
        } catch (error) {
            console.error(error);
            setSyncStatus('Failed to push data. Check console/keys.', true);
        }
    }

    async function pullFromCloud() {
        const binId = document.getElementById('jsonbin-id').value.trim();
        const apiKey = document.getElementById('jsonbin-key').value.trim();

        if (!binId || !apiKey) {
            setSyncStatus('Please enter both Bin ID and API Key.', true);
            return;
        }

        localStorage.setItem(CONFIG_KEYS.binId, binId);
        localStorage.setItem(CONFIG_KEYS.apiKey, apiKey);

        setSyncStatus('Fetching data from cloud...');

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                method: 'GET',
                headers: {
                    'X-Master-Key': apiKey
                }
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const result = await response.json();
            const cloudData = result.record;

            if (cloudData.ocs) {
                localStorage.setItem('gacha_ocs', JSON.stringify(cloudData.ocs));
            }
            if (cloudData.settings) {
                localStorage.setItem('gacha_theme', JSON.stringify(cloudData.settings));
            }

            setSyncStatus('Successfully pulled data! Reloading... 🔄');
            setTimeout(() => { window.location.reload(); }, 1000);
        } catch (error) {
            console.error(error);
            setSyncStatus('Failed to pull data. Check Bin ID/Key.', true);
        }
    }

    // Theme Customization System
    function openThemeModal() {
        document.getElementById("presetSelect").value = themeSettings.preset || "custom";
        document.getElementById("colorBg").value = themeSettings.bgColor || "#0f172a";
        document.getElementById("colorCard").value = themeSettings.cardBg || "#1e293b";
        document.getElementById("colorText").value = themeSettings.textColor || "#f8fafc";
        document.getElementById("colorAccent").value = themeSettings.accentColor || "#6366f1";
        document.getElementById("cardStyleSelect").value = themeSettings.cardStyle || "solid";
        document.getElementById("inputCardPic").value = themeSettings.cardBgPic || "";
        document.getElementById("inputWallpaper").value = themeSettings.wallpaperUrl || "";
        document.getElementById("wallpaperBlur").value = themeSettings.wallpaperBlur || 0;
        document.getElementById("wallpaperOverlay").value = themeSettings.wallpaperOverlay !== undefined ? themeSettings.wallpaperOverlay : 30;

        document.getElementById("blurVal").textContent = (themeSettings.wallpaperBlur || 0) + "px";
        document.getElementById("overlayVal").textContent = (themeSettings.wallpaperOverlay !== undefined ? themeSettings.wallpaperOverlay : 30) + "%";

        toggleCustomCardPicInput();
        document.getElementById("themeModal").style.display = "flex";
    }

    function closeThemeModal() {
        document.getElementById("themeModal").style.display = "none";
    }

    function toggleCustomCardPicInput() {
        const cardStyle = document.getElementById("cardStyleSelect").value;
        const picGroup = document.getElementById("customCardPicGroup");
        picGroup.style.display = (cardStyle === "customPic") ? "flex" : "none";
    }

    function applyPresetTheme(presetKey) {
        if (PRESET_THEMES[presetKey]) {
            const p = PRESET_THEMES[presetKey];
            document.getElementById("colorBg").value = p.bgColor;
            document.getElementById("colorCard").value = p.cardBg;
            document.getElementById("colorText").value = p.textColor;
            document.getElementById("colorAccent").value = p.accentColor;
            document.getElementById("cardStyleSelect").value = p.cardStyle;
            toggleCustomCardPicInput();
        }
    }

    function handleWallpaperUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("inputWallpaper").value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function handleCardTextureUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("inputCardPic").value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function removeWallpaper() {
        document.getElementById("inputWallpaper").value = "";
        document.getElementById("inputWallpaperFile").value = "";
    }

    function saveThemeSettings() {
        themeSettings = {
            preset: document.getElementById("presetSelect").value,
            bgColor: document.getElementById("colorBg").value,
            cardBg: document.getElementById("colorCard").value,
            textColor: document.getElementById("colorText").value,
            accentColor: document.getElementById("colorAccent").value,
            cardStyle: document.getElementById("cardStyleSelect").value,
            cardBgPic: document.getElementById("inputCardPic").value,
            wallpaperUrl: document.getElementById("inputWallpaper").value,
            wallpaperBlur: parseInt(document.getElementById("wallpaperBlur").value, 10),
            wallpaperOverlay: parseInt(document.getElementById("wallpaperOverlay").value, 10)
        };

        localStorage.setItem("gacha_theme", JSON.stringify(themeSettings));
        applyTheme(themeSettings);
        closeThemeModal();
    }

    function resetTheme() {
        themeSettings = { ...PRESET_THEMES.default };
        localStorage.setItem("gacha_theme", JSON.stringify(themeSettings));
        openThemeModal();
        applyTheme(themeSettings);
    }

    function hexToRgb(hex) {
        let c = hex.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    function applyTheme(theme) {
        const root = document.documentElement;
        root.style.setProperty('--bg-color', theme.bgColor);
        root.style.setProperty('--card-bg', theme.cardBg);
        root.style.setProperty('--card-bg-rgb', hexToRgb(theme.cardBg));
        root.style.setProperty('--text-main', theme.textColor);
        root.style.setProperty('--accent', theme.accentColor);

        const wpContainer = document.getElementById("wallpaperContainer");
        const wpOverlay = document.getElementById("wallpaperOverlayLayer");

        if (theme.wallpaperUrl) {
            wpContainer.style.backgroundImage = `url("${theme.wallpaperUrl}")`;
            wpContainer.style.filter = `blur(${theme.wallpaperBlur || 0}px)`;
            wpContainer.style.transform = (theme.wallpaperBlur > 0) ? 'scale(1.05)' : 'scale(1)';
            wpOverlay.style.backgroundColor = `rgba(0, 0, 0, ${(theme.wallpaperOverlay !== undefined ? theme.wallpaperOverlay : 30) / 100})`;
        } else {
            wpContainer.style.backgroundImage = 'none';
            wpOverlay.style.backgroundColor = 'transparent';
        }

        const styledElements = document.querySelectorAll('.controls, .card, .modal-content');
        styledElements.forEach(el => {
            el.classList.remove('appearance-solid', 'appearance-glass', 'appearance-glow', 'appearance-customPic');
            el.classList.add(`appearance-${theme.cardStyle || 'solid'}`);
        });
    }

    // Event Listeners Initialization on DOM Content Loaded
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('jsonbin-id').value = localStorage.getItem(CONFIG_KEYS.binId) || '';
        document.getElementById('jsonbin-key').value = localStorage.getItem(CONFIG_KEYS.apiKey) || '';

        document.getElementById('sync-push').addEventListener('click', pushToCloud);
        document.getElementById('sync-pull').addEventListener('click', pullFromCloud);

        searchInput.addEventListener("input", render);
        versionFilter.addEventListener("change", render);
        categoryFilter.addEventListener("change", render);
        tagFilter.addEventListener("change", render);
        imageFilter.addEventListener("change", render);

        updateDropdowns();
        render();
    });
</script>
</body>
</html>
